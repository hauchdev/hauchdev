name: Metrics

on:
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - ".github/workflows/readme.yml"
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/readme.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint README
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: README.md
          config: .markdownlint.json
