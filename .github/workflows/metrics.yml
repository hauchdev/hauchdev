name: Update System Metrics

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    name: Generate profile cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: hauchdev

          cards: >-
            overview,
            momentum,
            contributions,
            composition,
            rhythm,
            repositories,
            portfolio,
            languages

          output-dir: profile
          themes: dark
          language-limit: 8

          font: Roboto
          mono-font: Roboto Mono

          commit: true
          commit-message: "chore(profile): update system metrics [skip ci]"
