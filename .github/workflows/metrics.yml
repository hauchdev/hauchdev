name: Update System Metrics

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    name: Generate profile metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub metrics
        uses: mjun0812/github-metrics@latest
        with:
          user: hauchdev
          token: ${{ secrets.GITHUB_TOKEN }}

          output_dir: ./profile

          output_action: none

          plugin_header: false
          plugin_languages: true
          plugin_stars: true
          plugin_activity: true

      - name: Rename generated cards
        run: |
          mv profile/languages.svg profile/languages.svg 2>/dev/null || true
          mv profile/stars.svg profile/overview.svg 2>/dev/null || true
          mv profile/activity.svg profile/activity.svg 2>/dev/null || true

      - name: Commit updated metrics
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update system metrics"
          file_pattern: "profile/*.svg"
